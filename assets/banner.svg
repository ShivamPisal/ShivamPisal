<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shivam Pisal profile banner</title>
  <desc id="desc">A modern glassmorphism banner for a Full Stack Java Developer profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.45" stop-color="#0B2840"/>
      <stop offset="1" stop-color="#102A28"/>
    </linearGradient>
    <linearGradient id="accent" x1="185" y1="100" x2="1195" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF"/>
      <stop offset="0.48" stop-color="#7CFFB2"/>
      <stop offset="1" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="card" x1="170" y1="72" x2="1228" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="120" y="42" width="1160" height="340" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="420" fill="url(#bg)"/>
  <rect width="1400" height="420" fill="url(#grid)"/>
  <path d="M-70 350 C190 200 276 477 522 318 C760 164 864 69 1075 148 C1244 211 1318 104 1472 54" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="90" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="160" y="70" width="1080" height="280" rx="30" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.22"/>
  </g>
  <circle cx="1096" cy="134" r="48" fill="#00F5FF" fill-opacity="0.16"/>
  <circle cx="1162" cy="276" r="72" fill="#7CFFB2" fill-opacity="0.12"/>
  <circle cx="250" cy="282" r="62" fill="#FFB703" fill-opacity="0.12"/>
  <g transform="translate(222 112)">
    <rect x="0" y="0" width="118" height="118" rx="28" fill="#07111F" fill-opacity="0.82" stroke="#00F5FF" stroke-opacity="0.7"/>
    <path d="M35 38 L18 58 L35 78" stroke="#00F5FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M83 38 L100 58 L83 78" stroke="#7CFFB2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M68 29 L50 88" stroke="#FFB703" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="382" y="154" fill="#B8FFF8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">FULL STACK JAVA DEVELOPER</text>
  <text x="380" y="222" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800">Shivam Pisal</text>
  <text x="383" y="272" fill="#D7E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Spring Boot | React | MySQL | AWS | DSA</text>
  <g transform="translate(383 304)" fill="none" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="0" y="0" width="146" height="38" rx="19" fill="#00F5FF" fill-opacity="0.12" stroke="#00F5FF" stroke-opacity="0.5"/>
    <text x="22" y="25" fill="#B8FFF8">API Builder</text>
    <rect x="166" y="0" width="158" height="38" rx="19" fill="#7CFFB2" fill-opacity="0.12" stroke="#7CFFB2" stroke-opacity="0.5"/>
    <text x="188" y="25" fill="#D8FFE8">Problem Solver</text>
    <rect x="344" y="0" width="168" height="38" rx="19" fill="#FFB703" fill-opacity="0.12" stroke="#FFB703" stroke-opacity="0.5"/>
    <text x="366" y="25" fill="#FFE6A3">Cloud Learner</text>
  </g>
</svg>
